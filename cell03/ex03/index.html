<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        /* ปุ่ม New */
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        /* กล่องรายการ */
        #ft_list div {
            background-color: #f4f4f4;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #ft_list div:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <button onclick="newTodo()">New</button>

    <div id="ft_list"></div>

    <script src="todo.js"></script>

</body>
</html>
