<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Showcase - Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
            color: #e0e0e0; 
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .card-custom { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            backdrop-filter: blur(10px); 
            transition: 0.4s;
            border-radius: 20px;
            padding: 40px;
        }
        .card-custom:hover { 
            border-color: #00d4ff; 
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            transform: translateY(-10px);
        }
        h1 { text-shadow: 0 0 15px rgba(0, 212, 255, 0.6); font-weight: bold; }
        .btn-space { border: 1px solid #00d4ff; color: #00d4ff; text-decoration: none; padding: 10px 20px; border-radius: 30px; transition: 0.3s; }
        .btn-space:hover { background: #00d4ff; color: #000; box-shadow: 0 0 15px #00d4ff; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="display-3 mb-5">SPACE MISSION: RUSH 00</h1>
        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card-custom">
                    <h2 class="mb-4">Settapong Chanda</h2>
                    <p class="mb-4">Member 2</p>

            </div>
            <div class="col-md-5 mb-4">

</html>
