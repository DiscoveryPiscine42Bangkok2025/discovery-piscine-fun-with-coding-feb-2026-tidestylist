<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <title>Responsive Table</title>
    <style>
        /* 1. สั่งให้ html และ body เต็มจอ 100% และไม่มีขอบขาว */
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif; /* เปลี่ยนฟอนต์ให้อ่านง่ายขึ้น */
        }

        /* 2. สั่งให้ตารางกว้างและสูงเต็ม 100% ของหน้าจอ */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse; /* ลบช่องว่างระหว่างเซลล์ */
        }

        /* 3. จัดตัวหนังสือให้อยู่ตรงกลางเป๊ะๆ */
        td {
            text-align: center;
            vertical-align: middle;
            width: 50%; /* แบ่งครึ่งคนละครึ่งจอ */
        }

        /* สีพื้นหลัง (เอามาจากข้อที่แล้ว) */
        .box1 { background-color: lightblue; }
        .box2 { background-color: lightgreen; }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box1">
                <h1>First Cell</h1>
                <p>ยืดหดตามจอได้ครับ</p>
            </td>
            
            <td class="box2">
                <h1>Second Cell</h1>
                <p>ลองย่อขยายดูสิ!</p>
            </td>
        </tr>
    </table>

</body>
</html>
