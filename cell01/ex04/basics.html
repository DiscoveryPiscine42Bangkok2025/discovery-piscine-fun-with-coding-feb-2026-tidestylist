<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>
    <style>
        /* 1. พื้นหลังสีชมพู */
        body {
            background-color: pink;
        }
        /* 3. หัวข้อใหญ่ สีขาว จัดกลาง */
        h1 {
            color: white;
            text-align: center;
        }
        /* จัดกล่องสินค้าให้วางคู่กัน */
        .shop-container {
            display: inline-block;
            text-align: center;
            margin: 20px;
        }
        /* 7. จัด Footer ชิดขวา ตัวเอียง ฟอนต์พิมพ์ดีด */
        .footer-style {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>&#128722; Online Shops & Shopping &#128722;</h1>

    <div class="shop-container">
        <img src="shop1.jpg" width="200"><br>
        <a href="https://www.amazon.com">Amazon</a>
    </div>

    <div class="shop-container">
        <img src="shop2.png" width="200"><br>
        <a href="https://www.ebay.com">eBay</a>
    </div>

    <hr>

    <p class="footer-style">
        &copy; เศรษฐพงศ์ 2026
    </p>

</body>
</html>
